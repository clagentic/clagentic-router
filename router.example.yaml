# router.example.yaml — clagentic-router configuration example.
#
# Copy this to router.yaml (or ~/.config/clagentic/router/router.yaml) and edit.
# All api_key / token values support "env:VAR_NAME" to read from environment.
#
# Model versioning:
#   Pin to a specific version:  model: claude-sonnet-4-6
#   Use latest in a family:     model: claude-sonnet  (resolves to current default)
#   Same pattern applies to opus, haiku, and fable (top-tier) families, e.g.
#   model: claude-fable-5 (pinned) or model: fable (latest alias).
#   Codex follows the same pattern via the codex CLI --model flag.
#   Update model strings here when you want to roll forward to a newer version.

# --- Backends ---
# Each backend is one LLM invocation path.
# Adapter types: claude_cli | codex_cli | codex_subagent | gemini_cli | ollama_http | anthropic_api | openai_api | bedrock_api

backends:

  # --- Local ---
  # llama.cpp on localhost:8080 — phi4-mini, GPU, ~15 tok/s, free.
  # Good for: summarization, classification, short Q&A, triage.
  # Not suitable for: complex reasoning, code, long-form generation.
  local-phi4:
    adapter: ollama_http
    url: http://localhost:8080
    model: phi4-mini
    cost_weight: 2.0
    timeout_seconds: 60

  # --- Claude CLI (low / mid / high) ---
  # Requires `claude` binary on PATH with active OAuth session on this host.

  claude-low:
    adapter: claude_cli
    model: claude-haiku-4-5     # pin: claude-haiku-4-5 | latest alias: claude-haiku
    cost_weight: 1.5
    timeout_seconds: 120
    # quota_probe:
    #   enabled: true
    #   interval: 30m          # probe if no organic data in this window
    #   model: claude-haiku-4-5  # cheapest model for the ping

  claude-mid:
    adapter: claude_cli
    model: claude-sonnet-4-6    # pin: claude-sonnet-4-6 | latest alias: claude-sonnet
    cost_weight: 0.8
    timeout_seconds: 240

  # claude-fable: highest tier, above opus. Priciest — lowest cost_weight so
  # the scorer only reaches it when a chain explicitly includes it.
  claude-fable:
    adapter: claude_cli
    model: claude-fable-5       # pin: claude-fable-5 | latest alias: fable
    cost_weight: 0.2
    timeout_seconds: 300

  claude-high:
    adapter: claude_cli
    model: claude-opus-4-7      # pin: claude-opus-4-7 | latest alias: claude-opus
    cost_weight: 0.3
    timeout_seconds: 300

  # --- Codex CLI (low / mid / high) ---
  # Requires `codex` binary on PATH with active OAuth session on this host.
  # Model names are ChatGPT Plus account model strings — verify against your
  # account at chatgpt.com/codex before enabling. Quota resets May 31 2026.
  #
  # Model alias note: the codex CLI passes the --model value through to the
  # ChatGPT Plus backend without router-level transformation. Unlike Claude CLI
  # which resolves family aliases (claude-sonnet → current Sonnet), OpenAI/Codex
  # does not expose a family-alias scheme — use pinned model strings (o4-mini,
  # o3, o3-pro) and update them explicitly when you want to roll forward.
  #
  # codex-low:
  #   adapter: codex_cli
  #   model: o4-mini              # pinned; no family alias scheme for Codex models
  #   cost_weight: 1.2
  #   timeout_seconds: 180
  #   rate_window_seconds: 10800
  #   rate_window_max_messages: 50
  #
  # codex-mid:
  #   adapter: codex_cli
  #   model: o3                   # pinned; verify name against chatgpt.com/codex
  #   cost_weight: 0.7
  #   timeout_seconds: 300
  #   rate_window_seconds: 10800
  #   rate_window_max_messages: 20
  #
  # codex-high:
  #   adapter: codex_cli
  #   model: o3-pro               # pinned; verify name against chatgpt.com/codex
  #   cost_weight: 0.2
  #   timeout_seconds: 600
  #   rate_window_seconds: 10800
  #   rate_window_max_messages: 10
  #
  # Model discovery (no hand-typed model string): omit `model` entirely and
  # codex_cli resolves it automatically from `codex debug models`, filtered
  # to visibility=list and supported_in_api=true, sorted best-first. Add
  # `model_rank` (0-indexed, best-first — same ordered-list idiom as tiers/
  # chains below) to pick something other than the best available model.
  # Resolution happens once at startup and is cached; a resolution failure
  # (e.g. codex not authenticated) fails that backend's construction with a
  # logged, actionable error rather than silently picking a wrong model —
  # `model` still wins byte-identically over discovery whenever it is set.
  #
  # codex-discovered-best:
  #   adapter: codex_cli
  #   # no `model` — resolves to model_rank 0 (best available) automatically
  #   cost_weight: 0.7
  #   timeout_seconds: 300
  #
  # codex-discovered-cheap:
  #   adapter: codex_cli
  #   model_rank: 2                # 0 = best available, 1 = next best, ...
  #   cost_weight: 1.0
  #   timeout_seconds: 180

  # --- Gemini CLI (flash / pro) ---
  # Requires `gemini` binary on PATH with active OAuth session on this host.
  # Authenticate with: gemini auth login
  # Override binary path with: GEMINI_BIN=/path/to/gemini
  #
  # Model strings are passed directly to the -m flag without transformation.
  # Short aliases (flash, pro, flash-lite) and full names
  # (gemini-2.5-flash, gemini-2.5-pro) are both accepted by the CLI.
  #
  # Note: the gemini CLI always emits keychain noise on stderr. This is normal
  # and does not indicate failure — only the exit code is authoritative.
  #
  # gemini-flash:
  #   adapter: gemini_cli
  #   model: gemini-2.5-flash     # free tier, generous quota, fast
  #   cost_weight: 1.8
  #   timeout_seconds: 120
  #
  # gemini-pro:
  #   adapter: gemini_cli
  #   model: gemini-2.5-pro       # higher quality, lower quota on free tier
  #   cost_weight: 0.6
  #   timeout_seconds: 300

  # --- API backends (optional, key-based, no OAuth dependency) ---
  # anthropic-low:
  #   adapter: anthropic_api
  #   model: claude-haiku-4-5
  #   api_key: env:ANTHROPIC_API_KEY
  #   cost_weight: 1.3
  #   timeout_seconds: 120
  #
  # openai-low:
  #   adapter: openai_api
  #   model: gpt-4o-mini
  #   api_key: env:OPENAI_API_KEY
  #   cost_weight: 1.1
  #   timeout_seconds: 120

  # --- AWS Bedrock (optional, AWS SDK credential chain — no api_key field) ---
  # Credentials resolve via the standard AWS SDK chain (env vars, shared
  # config/credentials files, web identity, ECS, IMDS) — never from this file.
  # region is REQUIRED: Bedrock has no default region.
  # See the "AWS Bedrock (bedrock_api)" section in README.md for the full
  # model-ID-form caveat (bare vs. region-prefixed inference profile IDs)
  # and the known gap around exact OpenAI-family Bedrock model ID strings.
  #
  # bedrock-claude:
  #   adapter: bedrock_api
  #   region: us-east-1
  #   model: anthropic.claude-sonnet-4-6-v1:0  # confirmed form; verify in the Bedrock console for your account/region
  #   # profile: env:AWS_PROFILE               # optional named AWS profile
  #   cost_weight: 0.8
  #   timeout_seconds: 180
  #
  # bedrock-openai:
  #   adapter: bedrock_api
  #   region: us-east-1
  #   model: REPLACE_WITH_EXACT_BEDROCK_MODEL_ID  # UNCONFIRMED — get the exact
  #     # invocable ID for your target OpenAI-family model from the Bedrock
  #     # console before using; do not guess a plausible-looking ID here.
  #   cost_weight: 0.8
  #   timeout_seconds: 180

# --- Tiers ---
# A tier is a named group of backends at the same capability level.
# The router scores all backends in a tier and picks the best available one.
# Add codex-low/mid/high to these tiers once Codex model names are verified.

tiers:
  local:  [local-phi4]
  low:    [claude-low]            # add codex-low once verified
  mid:    [claude-mid]            # add codex-mid once verified
  high:   [claude-high]           # add codex-high once verified

# --- Chains ---
# Named chains are ordered lists of tiers tried in sequence on failure/exhaustion.
# Chain name reflects the capability ceiling, not the task type.
# Reference with model field "role:<chain-name>".

chains:
  # Full stack — local (free) → low → mid → high
  # Maximum redundancy. Use for general work.
  default:  [local, low, mid, high]

  # Cloud full stack — skip local, full cloud escalation
  # When local quality is not acceptable but full redundancy still wanted.
  cloud:    [low, mid, high]

  # Local with cheap cloud fallback
  # Free first; if local is down, cheap cloud covers it. Nothing higher.
  local:    [local, low]

  # Low ceiling — cheap cloud only, no escalation
  low:      [low]

  # Mid ceiling — low first, mid fallback
  mid:      [low, mid]

  # High ceiling — mid first, high fallback
  high:     [mid, high]

  # Max — high only, no fallback, fail fast
  max:      [high]

  # Triage — local only, no cloud spend
  triage:   [local]

  # --- POST /v1/messages "role:*" examples ---
  # Referenced via model: "role:reviewer-chain" / "role:auditor-chain" on the
  # Anthropic Messages endpoint (see the "Anthropic Messages API" section in
  # README.md). One-shot review/audit roles are a good fit for routed mode;
  # tool-using builder roles are NOT — routed mode drops tool-calling.
  reviewer-chain: [mid, high]
  auditor-chain:  [low, mid]

# --- Routing ---
routing:
  strategy: scored

  degraded_failure_threshold: 3
  offline_failure_threshold:  6

  health_probe_interval_seconds: 120
  quota_poll_interval_seconds: 300
  quota_warning_threshold: 0.20

  # Latency EMA penalty threshold (ms). 0 = disabled.
  latency_penalty_threshold_ms: 15000

  # rate_limit_tokens_warning_threshold: 1000  # soft penalty when tokens-remaining drops below this; 0 = disabled

  active_probe_enabled: false
  active_probe_timeout_seconds: 30

  # offline_recovery_probe_interval_seconds: 300
  # Self-heal OFFLINE backends (including auth failures, soft-failure cascades,
  # and any offline cause without a known reset time) by issuing a bounded probe
  # after this many seconds of inactivity. On success the backend enters RECOVERING
  # and is re-evaluated for traffic without waiting on organic requests.
  # Quota/rate-limit offlines with a known future reset time are NOT probed here;
  # TryRecover() already owns those and probing them early would violate the
  # provider's back-off window.
  # Default: 300 (5 minutes). Set to 0 to disable (strict manual-intervention
  # semantics — operator must use /backends/{id}/reset to re-enable).

# --- Workspace trust (claude_cli / codex_subagent) ---
# There is no trusted_working_dirs setting — a prior version of this file
# had one, gating an operator-configured allowlist for pre-accepting the
# Claude Code CLI's per-project trust dialog. That dialog never fires for
# claude_cli/codex_subagent in the first place: both invoke the CLI in
# non-interactive print mode ("claude --print" / "claude -p"), and the CLI's
# own --print help text states the trust dialog is skipped in non-interactive
# mode. The allowlist was gating nothing real; a leftover
# trusted_working_dirs key in an existing router.yaml is ignored (logged at
# Warn, not a startup error) — remove it.
#
# The real exposure this daemon closes instead: because there is no trust
# dialog, a caller-supplied working_dir's .claude/settings.json hooks,
# permissions.allow entries, and project CLAUDE.md memory would otherwise
# execute inside this daemon's subprocess for any caller who can reach
# /v1/chat/completions with that working_dir value. claude_cli and
# codex_subagent now pass --setting-sources user unconditionally (not
# configurable here) so the CLI loads only user-scope settings for the
# session -- project-scope settings.json (hooks, permissions.allow) and
# CLAUDE.md are never read, while auth and normal operation continue
# unaffected. --safe-mode was tried first and found insufficient (it left
# project permissions.allow entries in effect); --setting-sources user
# closes that gap too. See the "Working directory (working_dir)" section
# in README.md for the full writeup, including the capability trade-off
# (a caller loses project CLAUDE.md context and skills) and the codex_cli/
# gemini_cli exposure assessment.

# --- Proxy ---
proxy:
  host: 127.0.0.1        # 0.0.0.0 for network access from other hosts
  port: 8765
  token: env:CLAGENTIC_ROUTER_TOKEN

# --- Anthropic Messages API (POST /v1/messages) ---
# See the "Anthropic Messages API" section in README.md for the full
# passthrough-vs-routed design and auth matrix.
anthropic:
  upstream_url: ""        # default: https://api.anthropic.com
  # upstream_api_key: env:ANTHROPIC_API_KEY
  # ^ optional: substitute a router-owned key for ALL passthrough requests,
  #   overriding whatever credential the client sent. Leave unset (default)
  #   to forward each client's own Anthropic key unchanged.

# --- AWS Bedrock InvokeModel API (POST /model/{modelId}/invoke[-with-response-stream]) ---
# See the "AWS Bedrock InvokeModel API" section in README.md for the full
# passthrough-vs-routed design and auth matrix. Only needed for passthrough —
# a deployment using only role:/chain:/backend: model IDs on this endpoint
# can omit this block entirely.
# bedrock:
#   region: us-east-1        # required for passthrough; Bedrock has no SDK default region
#   # profile: env:AWS_PROFILE  # optional named AWS profile for passthrough credential resolution

# --- Deploy ("clagentic-router update" self-deploy subcommand) ---
# Entirely optional. `update` rebuilds the binary from source and restarts
# the running service, reusing this same config file (same resolution chain
# "serve" uses — no second config surface). Every field defaults to a stock
# systemd install; a clean third-party install works unconfigured. Only add
# this block if your install path, unit name, or source checkout location
# differs from the defaults below.
# deploy:
#   source_dir: .                                   # module root to build from
#   install_path: /usr/local/bin/clagentic-router    # path the running service execs
#   service_name: clagentic-router                   # systemd unit (without .service)
#   service_manager: systemd                         # systemd | none (install only, no restart)

# --- Storage ---
storage:
  db_path: ""   # default: $XDG_STATE_HOME/clagentic-router/state.db

# --- Alerts ---
alerts:
  webhooks: []
  # - url: https://hooks.example.com/clagentic
  #   events: [backend_offline, quota_exhausted, chain_exhausted, auth_failure]
  #   secret: env:WEBHOOK_SECRET

# --- Logging ---
log:
  # level: info     # debug|info|warn|error  (override: CLAGENTIC_ROUTER_LOG_LEVEL)
  # format: text    # text|json              (override: CLAGENTIC_ROUTER_LOG_FORMAT)
