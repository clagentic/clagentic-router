# .clagentic/loadout/config.yaml — clagentic-router repo-local loadout config
#
# Initialized via /loadout-init (lr-f181b6, fleet migration lr-a645aa
# instance). Values below are elicited for THIS repo, not copied from
# another deployment's config (loadout-init rule 1).
#
# One sectioned file, one top-level key per verb/feature.

# ---------------------------------------------------------------------------
# roles: -- which loadout verbs each ROLE may invoke. Role names are
# vocabulary only (builder/reviewer/security/merger/lead), never an agent
# identity.
# ---------------------------------------------------------------------------
roles:
  builder:
    - push
  reviewer:
    - git-host-api
    - review-post
    - stage-body
  merger:
    - merge
    - push
    - release-dispatch
    - release-detect
  lead:
    - git-host-api

# ---------------------------------------------------------------------------
# merge: -- merge-gate declarations. Every key here is repo-tier policy.
# ---------------------------------------------------------------------------
merge:
  merge_requirements:
    # ci_pass: false -- the repo's only CI definition is
    # .forgejo/workflows/ci.yml, which is Forgejo-native (uses:
    # https://code.forgejo.org/actions/checkout@v3, runs-on: the
    # clagentic-router repo-scoped Forgejo runner). This repo's origin is
    # GitHub (clagentic/clagentic-router; migrated Forgejo->GitHub
    # 2026-06-04) with no .github/workflows/ present -- GitHub Actions does
    # not read .forgejo/ and cannot run this workflow. No CI actually runs
    # on PRs on the live platform, so ci_pass:true would be a standing false
    # merge-blocker. Operator-confirmed 2026-07-18 (lr-f181b6): set to
    # false to match the live-platform reality, not the aspirational one.
    # Revisit if/when a .github/workflows/ci.yml equivalent is added.
    ci_pass: false
    # tests_pass: true -- NAOMI requires a clean `go test ./...` run
    # regardless of hosted CI; this repo has real, fast unit tests.
    tests_pass: true

  # required_reviewer_roles: PEACHES reviews every PR in this repo's crew
  # session today.
  required_reviewer_roles:
    - reviewer

  # authorized_roles: NAOMI is the sole merge authority; loadout-merge is
  # the only entrypoint.
  authorized_roles:
    - merger

  # pre_checks: none -- no additional pre-merge validation commands beyond
  # the reviewer-role and tests_pass gates above.

  # post_merge_steps: this file, under merge:, is the ONLY surface
  # loadout-post-merge reads (clagentic-loadout
  # src/clagentic_loadout/merge/post_merge_config.py load_post_merge_steps,
  # resolve_repo_config_path -> <repo>/.clagentic/loadout/config.yaml,
  # top-level merge: section, post_merge_steps: key). It has never read
  # .crew/naomi.yaml. lr-1ffd57 added the step there instead of here, so
  # PR #32 merged with steps_run=0 -- a silent no-op (lr-8cde5a). The
  # .crew/naomi.yaml copy is kept transitionally per the lr-4e6f31 item 3
  # precedent but is not read by any loadout verb.
  #
  # lr-a814a5: a bare `clagentic-router update` resolves via PATH to the
  # INSTALLED binary, which on a fresh merge still predates whatever
  # commit just landed -- it cannot bootstrap a subcommand only the new
  # source tree knows about (confirmed: PR #33's merge hit "unknown
  # subcommand update" because /usr/local/bin/clagentic-router predated
  # the update subcommand shipped in PR #32). loadout-merge always syncs
  # the working tree to the merged SHA and runs every step with cwd set to
  # that tree (merge.post_merge.run_post_merge_steps: `cwd=root`, `root =
  # str(project_root)`) BEFORE any step executes, so `go run
  # ./cmd/clagentic-router update` below builds and runs the update
  # subcommand straight out of the just-merged source -- never the
  # installed binary -- and is immune to this staleness class permanently.
  # List-form cmd (an explicit argv, not a shell-quoted string) also drops
  # the bare-PATH-resolved-name pattern BOBBIE flagged (PR #33 comment
  # 5271770612): the first token is `go`, a toolchain binary this repo's
  # own `make build`/`make test` already assume is on PATH, not
  # `clagentic-router` itself.
  post_merge_steps:
    - cmd: ["go", "run", "./cmd/clagentic-router", "update"]
      description: "rebuild+install+restart from the merged source tree (immune to installed-binary staleness; see comment above)"
      on_failure: fail
